<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Complete your sign-in</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.6;">
<div style="max-width: 560px; margin: 20px auto; padding: 24px;
                border: 1px solid #e5e7eb; border-radius: 8px;">
    <h2>Verify your identity</h2>
    <p>
        Hi <span th:text="${username}">User</span>,
    </p>
    <p>We received a request to sign in to your account.</p>
    <p>Click the link below to verify your identity:</p>
    <p style="margin: 24px 0;">
        <a href="#"
           style="display: inline-block; padding: 12px 24px;
                      background-color: #2563eb; color: #ffffff;
                      text-decoration: none; border-radius: 6px;"
           th:href="${verificationUrl}">
            Verify your identity
        </a>
    </p>
    <p>
        This link will expire in
        <strong th:text="${expiresInMinutes}">5</strong>
        minutes.
    </p>
    <p>If you did not attempt to sign in, please ignore this email.</p>
    <p>Regards,<br>Pranit Workspace</p>
</div>
</body>
</html>
