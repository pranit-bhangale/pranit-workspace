spring:
  application:
    name: workspace
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PranitWorkspace
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 5s
  # Java Mail Sender Configuration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: ${MAIL_PROTOCOL}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # Upload Configuration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
# Spring Session Configuration
server:
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: ${COOKIE_HTTP_ONLY}
        secure: ${COOKIE_SECURE}
        same-site: ${COOKIE_SAME_SITE}
# JWT Token Configuration
security:
  accessToken:
    expiration: 900
  refreshToken:
    expiration: 86400
  token:
    issuer: Pranit Bhangale
  cookie:
    name:
      refreshTokenName: refreshToken
      accessTokenName: accessToken
    cookieHttpOnly: ${COOKIE_HTTP_ONLY}
    cookieSecure: ${COOKIE_SECURE}
    cookieSameSite: ${COOKIE_SAME_SITE}
    cookieDomain: ${COOKIE_DOMAIN}
  # Keys Configuration
  keys:
    privateKeyPath: ${PRIVATE_KEY_PATH}
    publicKeyPath: ${PUBLIC_KEY_PATH}
workspace:
  ui:
    url: http://localhost:3000
    path: /mfa
  owner:
    email: pranitbhangale14@gmail.com
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      - HEAD
    allowed-headers:
      - Content-Type
      - X-API-Version
      - Accept
      - Origin
      - Access-Control-Request-Method
      - Access-Control-Request-Headers
    allow-credentials: true
# MinIO Configuration
minio:
  endpoint: ${MINIO_URL}
  access-key: ${ACCESS_KEY}
  secret-key: ${SECRET_KEY}
  bucket-name: ${BUCKET_NAME}
  presigned-url-expiry-days: 7
# Swagger Configuration
springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH}
  level:
    root: ${LOG_LEVEL_ROOT}
    com.pranit.workspace: ${WORKSPACE_LOG_LEVEL}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: pranit-workspace
    description: "A portfolio of modern backend and AI engineering projects focused on document intelligence, semantic search, vector databases, and intelligent conversational applications."
    version: "1.0.0"
